onboarding = false

[keys]
prefix = "ctrl+a"
previous_tab = "alt+h"
next_tab = "alt+l"
move_tab_previous = ["ctrl+shift+left", "alt+shift+h"]
move_tab_next = ["ctrl+shift+right", "alt+shift+l"]
previous_workspace = "alt+k"
next_workspace = "alt+j"

[[keys.command]]
key = ["ctrl+shift+up", "alt+shift+k"]
type = "shell"
command = "python3 \"$HOME/git/perfect-terminal/herdr-move-workspace.py\" up"
description = "move workspace up"

[[keys.command]]
key = ["ctrl+shift+down", "alt+shift+j"]
type = "shell"
command = "python3 \"$HOME/git/perfect-terminal/herdr-move-workspace.py\" down"
description = "move workspace down"

[ui]
show_agent_labels_on_pane_borders = true
status_indicators = "dots"

[ui.toast]
delivery = "system"

[theme]
name = "dracula"
auto_switch = false
